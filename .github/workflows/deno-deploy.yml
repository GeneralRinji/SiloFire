name: Deploy To Deno Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deno-deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deploy application
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: deno deploy --config ./deno.json --org rinjistudios --app rinjistudios --token "$DENO_DEPLOY_TOKEN" --prod --no-wait