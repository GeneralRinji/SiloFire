# demo04 block-level event sketch
#
# Outdoor enter sample so time/weather-style predicates can shape passive arrival text.

events:
  inspect_streetlamps_in_daylight:
    trigger:
      kind: poi
      actor: player
      nodeId: sidewalk_north
      poiId: streetlamps

    when:
      predicate: is_day

    actor:
      - The streetlamps are off. In daylight they look decorative, almost unnecessary.

  inspect_streetlamps_at_dusk:
    trigger:
      kind: poi
      actor: player
      nodeId: sidewalk_north
      poiId: streetlamps

    when:
      predicate: is_dusk

    actor:
      - The streetlamps have just come on, each globe warming from dim amber to a steadier glow.

  inspect_streetlamps_at_night:
    trigger:
      kind: poi
      actor: player
      nodeId: sidewalk_north
      poiId: streetlamps

    when:
      predicate: is_night

    actor:
      - The streetlamps are fully on now, throwing pale halos across the glass and concrete.

  inspect_streetlamps_at_dawn:
    trigger:
      kind: poi
      actor: player
      nodeId: sidewalk_north
      poiId: streetlamps

    when:
      predicate: is_dawn

    actor:
      - The streetlamps have gone dark again, leaving the block to the thin blue light of dawn.

  enter_sidewalk_north_in_daylight:
    trigger:
      kind: enter
      actor: player
      nodeId: sidewalk_north

    when:
      predicate: is_day

    actor:
      - Daylight flattens the storefronts into a tidy row of surfaces and reflections.

    private:
      text:
        - Out here the whole block feels arranged for inspection.

    witnesses:
      text:
        - '{actor.name|Someone} steps onto the north sidewalk and squints into the brighter side of the block.'

  enter_sidewalk_north_at_dusk:
    trigger:
      kind: enter
      actor: player
      nodeId: sidewalk_north

    when:
      predicate: is_dusk

    actor:
      - Dusk pulls a copper sheen across the storefront glass and softens the hard edges of the block.
      - One by one, the streetlamps along the curb flick on.

    private:
      text:
        - The whole row feels less inspected now, and more like it is bracing for the night shift.

    witnesses:
      text:
        - '{actor.name|Someone} steps onto the north sidewalk just as the light starts going bronze.'

  enter_sidewalk_north_at_night:
    trigger:
      kind: enter
      actor: player
      nodeId: sidewalk_north

    when:
      predicate: is_night

    actor:
      - At night the block turns reflective, all dark panes and streetlamp halos.

    private:
      text:
        - The storefronts stop pretending to be open and start looking like sealed displays.

    witnesses:
      text:
        - '{actor.name|Someone} steps onto the north sidewalk under the lamps and slows a little.'

  enter_sidewalk_north_at_dawn:
    trigger:
      kind: enter
      actor: player
      nodeId: sidewalk_north

    when:
      predicate: is_dawn

    actor:
      - Dawn lifts the block in stages, first the glass, then the doors, then the pale concrete.
      - The streetlamps blink off and give the block back to the morning light.

    private:
      text:
        - For a moment the whole row looks undecided, like it has not picked a mood yet.

    witnesses:
      text:
        - '{actor.name|Someone} steps onto the north sidewalk while the first light is still thin.'