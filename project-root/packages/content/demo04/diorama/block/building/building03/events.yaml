# demo04 building03 event sketch
#
# Building 03 uses a visible sidewalk-facing gate and forces visitors back outside whenever the door is closed.

events:
  enter_building03_groundfloor_when_closed:
    trigger:
      kind: enter
      actor: player
      nodeId: building03_groundfloor

    when:
      predicate: building03_door_is_closed

    actor:
      - The room gives you only a blink of interior shadow before the closed door and the tight layout push the visit back outside.
      - "*boink!*"

    effects:
      - navigate: [building03groundfloor_sidewalk_east, backward]

  enter_building03_upstairs_when_closed:
    trigger:
      kind: enter
      actor: player
      nodeId: building03_upstairs

    when:
      predicate: building03_door_is_closed

    actor:
      - Upstairs feels unavailable while the door is closed. A moment later you are back out at the door.
      - "*boink!*"

    effects:
      - navigate: [building03groundfloor_sidewalk_east, backward]

  enter_building03_door_when_open:
    trigger:
      kind: enter
      actor: player
      nodeId: building03groundfloor_sidewalk_east

    when:
      predicate: building03_door_is_open

    actor:
      - The door stands open and unlocked right now.

  enter_building03_door_when_closed:
    trigger:
      kind: enter
      actor: player
      nodeId: building03groundfloor_sidewalk_east

    when:
      predicate: building03_door_is_closed

    actor:
      - The door is shut and locked right now.

  inspect_building03_business_hours_when_open:
    trigger:
      kind: poi
      actor: player
      nodeId: building03groundfloor_sidewalk_east
      poiId: business_hours

    when:
      predicate: building03_door_is_open

    actor:
      - Open all day. Closed at night. Right now the place is open.

  inspect_building03_business_hours_when_closed:
    trigger:
      kind: poi
      actor: player
      nodeId: building03groundfloor_sidewalk_east
      poiId: business_hours

    when:
      predicate: building03_door_is_closed

    actor:
      - Open all day. Closed at night. Right now the place is closed.

  enter_building03_when_open:
    trigger:
      kind: choice
      actor: player
      nodeId: building03groundfloor_sidewalk_east
      choiceId: enter_building03

    when:
      predicate: building03_can_enter

    offer:
      label: Go Inside
      key: G

    actor:
      - The door gives easily. You step into the narrow ground-floor room.

    effects:
      - navigate: [building03_groundfloor]