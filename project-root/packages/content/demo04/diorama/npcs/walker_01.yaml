# demo04 walker sketch
#
# Slow block walker for outdoor ambient life.
# Intended to move on a shared ambient world clock later.

id: walker_01
displayName: Block Walker
role: passerby

location: sidewalk_north
behaviorMode: strolling

route:
  mode: loop
  dwellSeconds: 10
  moveSeconds: 12
  steps:
    - nodeId: sidewalk_north
    - nodeId: sidewalk_east
    - nodeId: sidewalk_south
    - nodeId: sidewalk_west

arrivalText:
  shared:
    - A walker comes around the block and briefly shares the sidewalk with you.

presenceText:
  shared:
    - A walker is already here, keeping to the sidewalk.

transitText:
  shared:
    - You spot a walker moving between corners along the block.

departureText:
  shared:
    - The walker keeps going, leaving the block to itself again.