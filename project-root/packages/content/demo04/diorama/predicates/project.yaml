# demo04 project predicate sketch
#
# This file now feeds the runtime-side event predicate layer.

predicates:
  is_day:
    equals: [world.time.phase, day]

  is_dusk:
    equals: [world.time.phase, dusk]

  is_evening:
    equals: [world.time.phase, dusk]

  is_night:
    equals: [world.time.phase, night]

  is_dawn:
    equals: [world.time.phase, dawn]

  building03_is_open_hours:
    any:
      - predicate: is_dawn
      - predicate: is_day
      - predicate: is_dusk

  building03_is_closed_hours:
    predicate: is_night

  building03_door_enabled:
    equals: [objects.building03_door.open, true]

  building03_door_disabled:
    equals: [objects.building03_door.open, false]

  building03_door_is_open:
    all:
      - predicate: building03_is_open_hours
      - predicate: building03_door_enabled

  building03_door_is_closed:
    any:
      - predicate: building03_is_closed_hours
      - predicate: building03_door_disabled

  building03_can_enter:
    predicate: building03_door_is_open

  is_raining:
    equals: [world.weather.kind, rain]

  resident_is_home:
    equals: [npcs.resident_01.location, building04_groundfloor]

  resident_is_nearby:
    same_location: [npcs.resident_01.location, player.location]

  resident_dialog_idle:
    equals: [story.resident_01.dialog_topic, idle]

  resident_dialog_greeting:
    equals: [story.resident_01.dialog_topic, greeting]

  resident_dialog_room_advice:
    equals: [story.resident_01.dialog_topic, room_advice]

  resident_dialog_sleep_setup:
    equals: [story.resident_01.dialog_topic, sleep_setup]

  resident_dialog_darkness:
    equals: [story.resident_01.dialog_topic, darkness]

  resident_dialog_lamp_hint:
    equals: [story.resident_01.dialog_topic, lamp_hint]

  resident_dialog_final_hint:
    equals: [story.resident_01.dialog_topic, final_hint]

  resident_dialog_active:
    any:
      - predicate: resident_dialog_greeting
      - predicate: resident_dialog_room_advice
      - predicate: resident_dialog_sleep_setup
      - predicate: resident_dialog_darkness
      - predicate: resident_dialog_lamp_hint
      - predicate: resident_dialog_final_hint

  resident_can_start_dialogue:
    all:
      - predicate: resident_is_nearby
      - predicate: resident_dialog_idle

  resident_can_ask_about_building:
    all:
      - predicate: resident_is_nearby
      - predicate: resident_dialog_greeting

  resident_can_ask_about_sleep:
    all:
      - predicate: resident_is_nearby
      - any:
          - predicate: resident_dialog_greeting
          - predicate: resident_dialog_room_advice

  resident_can_admit_dislike_dark:
    all:
      - predicate: resident_is_nearby
      - any:
          - predicate: resident_dialog_room_advice
          - predicate: resident_dialog_sleep_setup

  resident_can_ask_about_lamp:
    all:
      - predicate: resident_is_nearby
      - any:
          - predicate: resident_dialog_sleep_setup
          - predicate: resident_dialog_darkness

  resident_can_press_final_hint:
    all:
      - predicate: resident_is_nearby
      - predicate: resident_dialog_lamp_hint

  resident_can_end_dialogue:
    all:
      - predicate: resident_is_nearby
      - predicate: resident_dialog_active

  vase_is_aligned:
    equals: [objects.vase_01.aligned, true]

  vase_is_misaligned:
    equals: [objects.vase_01.aligned, false]

  actor_recognizes_cheap_imitation:
    equals: [actor.perception.recognizes_cheap_imitation, true]

  night_light_is_on:
    equals: [objects.night_light.on, true]

  night_light_is_off:
    equals: [objects.night_light.on, false]

  bedside_lamp_is_on:
    equals: [objects.bedside_lamp.on, true]

  bedside_lamp_is_off:
    equals: [objects.bedside_lamp.on, false]

  building04_can_sleep:
    all:
      - predicate: is_night
      - predicate: night_light_is_on
      - predicate: bedside_lamp_is_off

  building04_morning_paper_is_here:
    equals: [objects.building04_morning_paper.available, true]

  building04_morning_paper_is_gone:
    equals: [objects.building04_morning_paper.available, false]

  counter_mint_available:
    equals: [objects.building02_counter_mint.available, true]

  counter_mint_missing:
    equals: [objects.building02_counter_mint.available, false]

  counter_mint_taken_in_day:
    equals: [objects.building02_counter_mint.last_taken_phase, day]

  counter_mint_taken_in_dusk:
    equals: [objects.building02_counter_mint.last_taken_phase, dusk]

  counter_mint_taken_in_night:
    equals: [objects.building02_counter_mint.last_taken_phase, night]

  counter_mint_taken_in_dawn:
    equals: [objects.building02_counter_mint.last_taken_phase, dawn]