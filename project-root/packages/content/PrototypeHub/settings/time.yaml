        statusText:
          - Daylight makes the narrow frontage look more experimental than commercial.
      - id: dusk
        durationMinutes: 2
        statusText:
          - The neon wins its argument with the fading light and turns the window into a soft electrical bruise.
      - id: night
        durationMinutes: 4
        statusText:
          - Night presses the chatter behind the glass a little closer to the street.
      - id: dawn
        durationMinutes: 2
        statusText:
          - Dawn leaves the sign buzzing to an audience of almost nobody.

